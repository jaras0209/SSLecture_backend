# ─────────────────────────────────────────────────────────────────────────────
# 本地開發：Docker 的 MySQL 8.4（先執行 `docker compose up -d`，見 compose.yaml）。
# 資料存在 Docker volume，重啟後保留；想從頭來過就 `docker compose down -v`，
# Liquibase 會重新建表並灌入種子資料與示範帳號。
# 要連到其他 MySQL 時以 DB_URL、DB_USERNAME、DB_PASSWORD 覆寫。
# ─────────────────────────────────────────────────────────────────────────────
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sslecture}
    username: ${DB_USERNAME:sslecture}
    password: ${DB_PASSWORD:sslecture}
  liquibase:
    contexts: dev
  jpa:
    show-sql: false
  data:
    redis:
      # 本機沒有 Redis 也能啟動；用到 Redis 的功能（社群登入 code）才需要
      host: ${REDIS_HOST:localhost}

management:
  health:
    redis:
      enabled: false

app:
  jwt:
    # 只供本地開發，正式環境必須以環境變數 JWT_SECRET 提供
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi0xMjM0NTY3OA==}

logging:
  level:
    com.sslecture: DEBUG
