# ─────────────────────────────────────────────────────────────────────────────
# Liquibase 主 changelog（MySQL 8.4）
#
# 001–003 與前端 docs/database_schema.md 第 6、7 節的 SQL 相同（該 SQL 由前端 CI 在 MySQL 8.4 實測）。
#
# 規則：
#   1. 已在正式環境執行的 changeset 不可再修改，要改結構就新增一個 changeset 檔，並同步更新前端文件第 6 節
#   2. 檔名：NNN-簡述.sql，依序 include
#   3. contexts：dev = 本地開發資料；test = 自動化測試；prod = 正式。未標 context 的 changeset 全部環境都跑
# ─────────────────────────────────────────────────────────────────────────────
databaseChangeLog:
  - include: { file: changes/000-database-charset.sql, relativeToChangelogFile: true }
  - include: { file: changes/001-schema.sql, relativeToChangelogFile: true }
  - include: { file: changes/002-seed-reference-data.sql, relativeToChangelogFile: true }
  - include: { file: changes/003-seed-dev-users.sql, relativeToChangelogFile: true }
